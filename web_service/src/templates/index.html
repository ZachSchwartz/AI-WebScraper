<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper Interface</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin-top: 2rem;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        .loading {
            display: none;
        }
        .query-results, .scrape-results {
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Web Scraper Interface</h4>
            </div>
            <div class="card-body">
                <form id="scrapeForm">
                    <div class="mb-3">
                        <label for="url" class="form-label">Target URL</label>
                        <input type="url" class="form-control" id="url" required
                               placeholder="https://example.com">
                    </div>
                    <div class="mb-3">
                        <label for="keyword" class="form-label">Keyword</label>
                        <input type="text" class="form-control" id="keyword" required
                               placeholder="Enter keyword to search">
                    </div>
                    <button type="submit" class="btn btn-primary">Start Scraping</button>
                </form>

                <div class="loading mt-3">
                    <div class="d-flex align-items-center">
                        <div class="spinner-border text-primary me-2" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <span>Scraping in progress...</span>
                    </div>
                </div>

                <div class="scrape-results mt-3" style="display: none;">
                    <h5>Scraping Results</h5>
                    <div id="results"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">Query Database</h4>
            </div>
            <div class="card-body">
                <form id="queryForm">
                    <div class="mb-3">
                        <label for="queryUrl" class="form-label">Source URL</label>
                        <input type="url" class="form-control" id="queryUrl"
                               placeholder="https://example.com">
                    </div>
                    <div class="mb-3">
                        <label for="queryKeyword" class="form-label">Keyword</label>
                        <input type="text" class="form-control" id="queryKeyword"
                               placeholder="Enter keyword to search">
                    </div>
                    <button type="submit" class="btn btn-info text-white">Search Database</button>
                </form>

                <div class="query-loading mt-3" style="display: none;">
                    <div class="d-flex align-items-center">
                        <div class="spinner-border text-info me-2" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <span>Searching database...</span>
                    </div>
                </div>

                <div class="query-results mt-3" style="display: none;">
                    <h5>Query Results</h5>
                    <div id="queryResults"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Query by URL</h4>
            </div>
            <div class="card-body">
                <form id="hrefQueryForm">
                    <div class="mb-3">
                        <label for="hrefUrl" class="form-label">URL to Look Up</label>
                        <input type="url" class="form-control" id="hrefUrl" required
                               placeholder="https://example.com/page">
                    </div>
                    <button type="submit" class="btn btn-success">Look Up URL</button>
                </form>

                <div class="href-query-loading mt-3" style="display: none;">
                    <div class="d-flex align-items-center">
                        <div class="spinner-border text-success me-2" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <span>Looking up URL...</span>
                    </div>
                </div>

                <div class="href-query-results mt-3" style="display: none;">
                    <h5>URL Details</h5>
                    <div id="hrefQueryResults"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Every value rendered below reaches the page from a scraped third-party
        // document, so it is written as text into a node rather than interpolated
        // into markup: a link whose href is `"><img onerror=...>` is then a string
        // on the page instead of a script running in the reader's session.
        function element(tag, className, text) {
            const node = document.createElement(tag);
            if (className) {
                node.className = className;
            }
            if (text !== undefined) {
                node.textContent = text;
            }
            return node;
        }

        // Only a URL the browser can navigate to becomes a link. A javascript:
        // or data: href is shown as the text it is, so a scraped page cannot
        // hand the reader something that runs when clicked.
        function urlNode(url) {
            const text = String(url ?? '');
            let scheme = '';
            try {
                scheme = new URL(text, window.location.href).protocol;
            } catch (error) {
                scheme = '';
            }

            if (scheme !== 'http:' && scheme !== 'https:') {
                return element('span', 'text-muted', text);
            }

            const link = element('a', 'text-decoration-none', text);
            link.href = text;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            return link;
        }

        function percentage(score) {
            return `Score: ${(Number(score) * 100).toFixed(1)}%`;
        }

        function showAlert(container, level, heading, message) {
            const alert = element('div', `alert alert-${level}`);
            alert.append(element('h5', null, heading), element('p', 'mb-0', message));
            container.replaceChildren(alert);
        }

        function scoreCard(url, score) {
            const row = element('div', 'd-flex justify-content-between align-items-center');
            const urlCell = element('div', 'text-truncate me-3');
            urlCell.append(urlNode(url));
            row.append(urlCell, element('span', 'badge bg-primary', percentage(score)));

            const body = element('div', 'card-body py-2');
            body.append(row);

            const card = element('div', 'card mb-2');
            card.append(body);
            return card;
        }

        function showScoredLinks(container, heading, links) {
            const list = element('div', 'mt-3');
            links.forEach(link => list.append(scoreCard(link.url, link.score)));

            const alert = element('div', 'alert alert-success');
            alert.append(element('h6', null, heading), list);
            container.replaceChildren(alert);
        }

        function detailRow(label, value) {
            const row = element('p', 'mb-2');
            row.append(element('strong', null, `${label}:`), ' ');
            row.append(value instanceof Node ? value : document.createTextNode(String(value)));
            return row;
        }

        async function submitQuery(event, handlers) {
            event.preventDefault();

            const loading = document.querySelector(handlers.loading);
            const resultsDiv = document.querySelector(handlers.results);
            const output = document.getElementById(handlers.output);

            loading.style.display = 'block';
            resultsDiv.style.display = 'none';
            output.replaceChildren();

            try {
                await handlers.run(output);
            } catch (error) {
                console.error(handlers.failure, error);
                showAlert(output, 'danger', 'Error', error.message);
            } finally {
                loading.style.display = 'none';
                resultsDiv.style.display = 'block';
            }
        }

        document.getElementById('scrapeForm').addEventListener('submit', event => submitQuery(event, {
            loading: '.loading',
            results: '.scrape-results',
            output: 'results',
            failure: 'Error during scraping:',
            run: async output => {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: document.getElementById('url').value,
                        keyword: document.getElementById('keyword').value,
                    }),
                });

                const data = await response.json();

                if (data.error) {
                    const blocked = data.error === 'robots_txt_error';
                    showAlert(
                        output,
                        blocked ? 'warning' : 'danger',
                        blocked ? 'Access Denied by robots.txt' : 'Error',
                        data.message
                    );
                    return;
                }

                showScoredLinks(
                    output,
                    `Found ${data.count} results for "${data.keyword}" on ${data.source_url}`,
                    data.results
                );
            },
        }));

        document.getElementById('queryForm').addEventListener('submit', event => submitQuery(event, {
            loading: '.query-loading',
            results: '.query-results',
            output: 'queryResults',
            failure: 'Error querying database:',
            run: async output => {
                const params = new URLSearchParams();
                const keyword = document.getElementById('queryKeyword').value;
                const sourceUrl = document.getElementById('queryUrl').value;
                if (keyword) params.append('keyword', keyword);
                if (sourceUrl) params.append('source_url', sourceUrl);

                const response = await fetch(`/db/query?${params.toString()}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || data.error || 'Failed to query database');
                }

                if (data.items.length === 0) {
                    const empty = element('div', 'alert alert-info', 'No results found for your query.');
                    output.replaceChildren(empty);
                    return;
                }

                showScoredLinks(
                    output,
                    `Found ${data.count} results for "${data.items[0].keyword}" on ${data.items[0].source_url}`,
                    data.items.map(item => ({ url: item.href_url, score: item.relevance_score }))
                );
            },
        }));

        document.getElementById('hrefQueryForm').addEventListener('submit', event => submitQuery(event, {
            loading: '.href-query-loading',
            results: '.href-query-results',
            output: 'hrefQueryResults',
            failure: 'Error querying URL:',
            run: async output => {
                const hrefUrl = document.getElementById('hrefUrl').value;
                const response = await fetch(`/db/query/href?href_url=${encodeURIComponent(hrefUrl)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || data.error || 'Failed to query URL');
                }

                const details = element('div', 'card-body');
                details.append(
                    detailRow('URL', urlNode(data.href_url)),
                    detailRow('Source', urlNode(data.source_url)),
                    detailRow('Keyword', data.keyword),
                    detailRow('Relevance Score', percentage(data.relevance_score))
                );

                const card = element('div', 'card');
                card.append(details);

                const body = element('div', 'mt-3');
                body.append(card);

                const alert = element('div', 'alert alert-success');
                alert.append(element('h6', null, 'URL Details Found'), body);
                output.replaceChildren(alert);
            },
        }));
    </script>
</body>
</html>
