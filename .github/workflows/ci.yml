name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: black --check database scorer producer util web_service tests

      - name: Lint
        run: pylint --disable=import-error database scorer producer util web_service tests

      # pytest.ini enforces the coverage floor, so this fails on a drop as well
      # as on a broken test.
      - name: Test
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The images carry their own source, so a build failure here is a real
      # deployment failure rather than a missing bind mount at run time.
      - name: Build the service images
        run: docker compose build producer db_processor web
